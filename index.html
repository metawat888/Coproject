<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Tools Banner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Thai (Sarabun) and English (Inter) text -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- 
      Banner Container
      Max width: 1400px, Height: 50px (h-[50px])
      Flexbox centered content, rounded corners, subtle shadow, dark/orange gradient theme
    -->
    <div class="max-w-[1400px] w-full h-[50px] bg-gradient-to-b from-orange-500 from-0% via-gray-900 via-25% to-gray-900 rounded-lg shadow-md flex items-center justify-center px-6 text-gray-200">

        <!-- Content Container -->
        <div class="flex items-center gap-4 sm:gap-6 md:gap-8 text-lg sm:text-xl">
            <!-- Text Label -->
            <span class="font-bold text-base sm:text-lg md:mr-2 tracking-wide whitespace-nowrap">Developer Tools :</span>

            <!-- HTML5 -->
            <i class="fa-brands fa-html5 hover:text-[#E34F26] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="HTML5"></i>
            
            <!-- CSS3 -->
            <i class="fa-brands fa-css3-alt hover:text-[#1572B6] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="CSS3"></i>
            
            <!-- JavaScript -->
            <i class="fa-brands fa-js hover:text-[#F7DF1E] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="JavaScript"></i>
            
            <!-- GitHub -->
            <i class="fa-brands fa-github hover:text-white transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="GitHub"></i>
            
            <!-- Google -->
            <i class="fa-brands fa-google hover:text-[#4285F4] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="Google"></i>
            
            <!-- Apple -->
            <i class="fa-brands fa-apple hover:text-white transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="Apple"></i>
            
            <!-- Facebook -->
            <i class="fa-brands fa-facebook hover:text-[#1877F2] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="Facebook"></i>
            
            <!-- YouTube -->
            <i class="fa-brands fa-youtube hover:text-[#FF0000] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="YouTube"></i>
            
            <!-- Discord -->
            <i class="fa-brands fa-discord hover:text-[#5865F2] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="Discord"></i>
            
            <!-- Flickr -->
            <i class="fa-brands fa-flickr hover:text-[#f40083] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="Flickr"></i>
            
            <!-- Node.js -->
            <i class="fa-brands fa-node hover:text-[#339933] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="Node.js"></i>

            <!-- LINE -->
            <i class="fa-brands fa-line hover:text-[#00C300] transition-colors duration-300 cursor-pointer hover:scale-110 transform" title="LINE"></i>
        </div>
        
    </div>

</body>
</html>
